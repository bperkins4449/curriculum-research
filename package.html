g&quot;, &quot;finding&quot;: &quot;Wrong sham AI pushed false negatives from 2.7% to as high as 33.0%; a box around the AI region and telling readers AI would be deleted each reduced some of the harm.&quot;, &quot;population&quot;: &quot;attendings&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;dratsch2023&quot;, &quot;cite&quot;: &quot;Dratsch T, et al. Radiology. 2023&quot;, &quot;title&quot;: &quot;Automation Bias in Mammography: The Impact of Artificial Intelligence BI-RADS Suggestions on Reader Performance.&quot;, &quot;year&quot;: 2023, &quot;pmid&quot;: &quot;37129490&quot;, &quot;n&quot;: &quot;27 radiologists&quot;, &quot;task&quot;: &quot;BI-RADS assessment of 50 mammograms with purported AI suggestions (12 of 40 test cases incorrect)&quot;, &quot;finding&quot;: &quot;All experience levels lost accuracy sharply when the AI was wrong (inexperienced 79.7% to 19.8%, very experienced 82.3% to 45.5%), and inexperienced readers followed wrong upgrades most.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: true, &quot;tested_fix&quot;: false, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;gaube2023&quot;, &quot;cite&quot;: &quot;Gaube S, et al. Sci Rep. 2023&quot;, &quot;title&quot;: &quot;Non-task expert physicians benefit from correct explainable AI advice when reviewing X-rays.&quot;, &quot;year&quot;: 2023, &quot;pmid&quot;: &quot;36697450&quot;, &quot;n&quot;: &quot;not stated in abstract&quot;, &quot;task&quot;: &quot;Chest X-ray diagnosis with correct advice, with or without visual annotation, labeled AI or human&quot;, &quot;finding&quot;: &quot;With only correct advice, annotated AI advice gave the highest accuracy and non-task experts gained most; it does not test wrong advice.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: false, &quot;trainee_vs_expert&quot;: true, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;jabbour2023&quot;, &quot;cite&quot;: &quot;Jabbour S, et al. JAMA. 2023&quot;, &quot;title&quot;: &quot;Measuring the Impact of AI in the Diagnosis of Hospitalized Patients: A Randomized Clinical Vignette Survey Study.&quot;, &quot;year&quot;: 2023, &quot;pmid&quot;: &quot;38112814&quot;, &quot;n&quot;: &quot;457 clinicians&quot;, &quot;task&quot;: &quot;Acute respiratory failure vignettes with chest radiographs: likelihood of pneumonia, heart failure, COPD&quot;, &quot;finding&quot;: &quot;Standard AI raised accuracy slightly, systematically biased AI cut accuracy by 11.3 points from a 73.0% baseline, and showing explanations did not meaningfully protect clinicians.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;wang2023&quot;, &quot;cite&quot;: &quot;Wang DY, et al. J Am Med Inform Assoc. 2023&quot;, &quot;title&quot;: &quot;Artificial intelligence suppression as a strategy to mitigate artificial intelligence automation bias.&quot;, &quot;year&quot;: 2023, &quot;pmid&quot;: &quot;37561535&quot;, &quot;n&quot;: &quot;40 clinicians&quot;, &quot;task&quot;: &quot;ACL rupture on 200 knee MRIs with and without AI&quot;, &quot;finding&quot;: &quot;AI raised accuracy from 87.2% to 96.4%, but 45.5% of remaining errors were automation bias across all expertise levels; hiding AI output where it tends to mislead was estimated to cut that by 41.7%.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: false, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: [&quot;The automation-bias reduction is a modeled estimate&quot;]}, {&quot;id&quot;: &quot;gaube2021&quot;, &quot;cite&quot;: &quot;Gaube S, et al. NPJ Digit Med. 2021&quot;, &quot;title&quot;: &quot;Do as AI say: susceptibility in deployment of clinical decision-aids.&quot;, &quot;year&quot;: 2021, &quot;pmid&quot;: &quot;33608629&quot;, &quot;n&quot;: &quot;not stated in abstract&quot;, &quot;task&quot;: &quot;Chest X-ray diagnosis with advice, some of it inaccurate, labeled as AI or human&quot;, &quot;finding&quot;: &quot;Inaccurate advice worsened accuracy regardless of its stated source; radiologists rated advice labeled AI as lower quality while less task-expert physicians did not.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: true, &quot;tested_fix&quot;: false, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;kiani2020&quot;, &quot;cite&quot;: &quot;Kiani A, et al. NPJ Digit Med. 2020&quot;, &quot;title&quot;: &quot;Impact of a deep learning assistant on the histopathologic classification of liver cancer.&quot;, &quot;year&quot;: 2020, &quot;pmid&quot;: &quot;32140566&quot;, &quot;n&quot;: &quot;11 pathologists&quot;, &quot;task&quot;: &quot;HCC vs cholangiocarcinoma on whole-slide images with a deep learning assistant&quot;, &quot;finding&quot;: &quot;The assistant&#x27;s natural errors pulled accuracy down (OR 0.253) while correct predictions raised it (OR 4.289), and both effects held across experience levels, trainees included.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: false, &quot;trainee_vs_expert&quot;: true, &quot;tested_fix&quot;: false, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;tschandl2020&quot;, &quot;cite&quot;: &quot;Tschandl P, et al. Nat Med. 2020&quot;, &quot;title&quot;: &quot;Human-computer collaboration for skin cancer recognition.&quot;, &quot;year&quot;: 2020, &quot;pmid&quot;: &quot;32572267&quot;, &quot;n&quot;: &quot;not stated in abstract&quot;, &quot;task&quot;: &quot;Dermoscopic skin lesion diagnosis with different AI support representations, including faulty AI&quot;, &quot;finding&quot;: &quot;Good AI helped the least experienced clinicians most, but faulty AI misled clinicians at every level, experts included.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;image&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: true, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;lyell2017&quot;, &quot;cite&quot;: &quot;Lyell D, et al. BMC Med Inform Decis Mak. 2017&quot;, &quot;title&quot;: &quot;Automation bias in electronic prescribing.&quot;, &quot;year&quot;: 2017, &quot;pmid&quot;: &quot;28302112&quot;, &quot;n&quot;: &quot;120 medical students&quot;, &quot;task&quot;: &quot;Simulated e-prescribing with correct, incorrect or no clinical decision support alerts&quot;, &quot;finding&quot;: &quot;Incorrect CDS raised missed prescribing errors by 24.5-33.3% and students accepted false alerts in 51.7-65.8% of scenarios; complexity and interruptions did not change this. Rule-based CDS, not AI.&quot;, &quot;population&quot;: &quot;students&quot;, &quot;ai_type&quot;: &quot;calc&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: false, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;novotny2017&quot;, &quot;cite&quot;: &quot;Novotny T, et al. Int J Med Inform. 2017&quot;, &quot;title&quot;: &quot;The role of computerized diagnostic proposals in the interpretation of the 12-lead electrocardiogram by cardiology and non-cardiology fellows.&quot;, &quot;year&quot;: 2017, &quot;pmid&quot;: &quot;28347451&quot;, &quot;n&quot;: &quot;30 fellows&quot;, &quot;task&quot;: &quot;100 ECGs read with no proposal, one proposal (half intentionally incorrect), or four proposals (one correct)&quot;, &quot;finding&quot;: &quot;A single wrong computer proposal sharply cut fellows&#x27; ECG accuracy, confidence tracked accuracy poorly, and showing several proposals looked safer than one.&quot;, &quot;population&quot;: &quot;residents&quot;, &quot;ai_type&quot;: &quot;calc&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: true, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: true, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: true, &quot;map_note&quot;: null, &quot;flags&quot;: []}, {&quot;id&quot;: &quot;goddard2012&quot;, &quot;cite&quot;: &quot;Goddard K, et al. J Am Med Inform Assoc. 2012&quot;, &quot;title&quot;: &quot;Automation bias: a systematic review of frequency, effect mediators, and mitigators.&quot;, &quot;year&quot;: 2012, &quot;pmid&quot;: &quot;21685142&quot;, &quot;n&quot;: &quot;74 studies&quot;, &quot;task&quot;: &quot;Systematic review of automation bias frequency, mediators and mitigators&quot;, &quot;finding&quot;: &quot;Task-specific experience, trust, workload and time pressure mediated automation bias; training, accountability and design choices such as confidence display were candidate mitigators.&quot;, &quot;population&quot;: &quot;mixed&quot;, &quot;ai_type&quot;: &quot;calc&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;planted_errors&quot;: false, &quot;trainee_vs_expert&quot;: false, &quot;tested_fix&quot;: false, &quot;read&quot;: &quot;abstract&quot;, &quot;in_map&quot;: false, &quot;map_note&quot;: &quot;systematic review&quot;, &quot;flags&quot;: []}], &quot;gaps&quot;: {&quot;written&quot;: &quot;2026-11-25&quot;, &quot;basis&quot;: &quot;52 studies read (sources.json); 50 placed on the map (one systematic review and one model-vs-resident comparison left off). Counts are of studies in this set, not of everything published.&quot;, &quot;gaps&quot;: [{&quot;id&quot;: &quot;docs-planted&quot;, &quot;title&quot;: &quot;No study in this set planted known errors in AI notes or patient messages for physicians to review&quot;, &quot;detail&quot;: &quot;Of 20 documentation studies, 7 measured only the AI&#x27;s own error rate. None put physicians in front of drafts with known, planted errors; the nearest is Surdilla 2026, which planted wrong GPT-4o order-verification advice for pharmacists. The closest: Small 2025, where time-limited IM residents edited LLM hospital courses less than physician ones and more confabulations remained, and Chen 2024, where attendings&#x27; edited portal replies converged on the AI draft.&quot;, &quot;evidence&quot;: [&quot;small2025&quot;, &quot;chen2024&quot;, &quot;williams2025ed&quot;, &quot;palm2025&quot;, &quot;surdilla2026&quot;], &quot;angle&quot;: &quot;drafts-that-ship&quot;}, {&quot;id&quot;: &quot;calculators&quot;, &quot;title&quot;: &quot;No study in this set tests a wrong risk-calculator result&quot;, &quot;detail&quot;: &quot;No study in the set tests whether clinicians catch a wrong or stale calculator input or a score applied to the wrong patient. That column holds only computer ECG reads (Novotny 2017) and e-prescribing alerts (Lyell 2017).&quot;, &quot;evidence&quot;: [&quot;novotny2017&quot;, &quot;lyell2017&quot;], &quot;angle&quot;: &quot;cross-type-catch-rate&quot;}, {&quot;id&quot;: &quot;fm-residents&quot;, &quot;title&quot;: &quot;One FM-trainee study, and it is not in the US&quot;, &quot;detail&quot;: &quot;Zhou 2025 is the only study in this set coded as FM/GP trainees: 137 GP trainees in China judged ChatGPT-4o answers at 55.0% accuracy (d&#x27; 0.39), close to chance (the paper reports its response-bias direction inconsistently).&quot;, &quot;evidence&quot;: [&quot;zhou2025&quot;], &quot;angle&quot;: &quot;cross-type-catch-rate&quot;}, {&quot;id&quot;: &quot;teaching&quot;, &quot;title&quot;: &quot;No controlled trial in this set teaches people to catch AI errors&quot;, &quot;detail&quot;: &quot;Qazi 2026 gave everyone 20 hours of AI-literacy training first, with no untrained arm, and wrong LLM output still cut accuracy (73.3% vs 84.9%). Hayden 2026 paired a lecture with a case and had no control group. No study uses catch rate on unseen cases as the outcome of a curriculum.&quot;, &quot;evidence&quot;: [&quot;qazi2026&quot;, &quot;hayden2026&quot;], &quot;angle&quot;: &quot;teach-and-transfer&quot;}, {&quot;id&quot;: &quot;one-reader&quot;, &quot;title&quot;: &quot;No study in this set shows the same reader several kinds of AI&quot;, &quot;detail&quot;: &quot;Every study in this set that tests error detection uses one kind of AI. No one knows whether a resident who catches image errors also catches note errors, or whether the skill transfers.&quot;, &quot;evidence&quot;: [&quot;jabbour2023&quot;, &quot;dratsch2023&quot;, &quot;zhou2025&quot;], &quot;angle&quot;: &quot;cross-type-catch-rate&quot;}, {&quot;id&quot;: &quot;experience&quot;, &quot;title&quot;: &quot;Trainee versus attending is shown almost only for images&quot;, &quot;detail&quot;: &quot;13 of the 15 studies comparing experience levels used image tasks, and experience helped but did not protect reliably (Dratsch 2023: correct reads with wrong AI fell to 19.8% in inexperienced and 45.5% in very experienced radiologists; Yu 2024: experience did not predict who was harmed). The comparison has not been made for LLM differentials or drafts in primary care.&quot;, &quot;evidence&quot;: [&quot;dratsch2023&quot;, &quot;yu2024&quot;, &quot;dusunceli2026&quot;, &quot;hedman2026&quot;, &quot;surdilla2026&quot;], &quot;angle&quot;: &quot;resident-vs-attending&quot;}, {&quot;id&quot;: &quot;real-practice&quot;, &quot;title&quot;: &quot;Almost everything is simulated, and real-practice studies have no answer key&quot;, &quot;detail&quot;: &quot;Most studies are simulated skill (K2b). The four real-practice (K3) studies cannot say what clinicians missed: Smith 2026 counts what users flagged (6.2% of summaries), Grolleau 2026 and Garcia 2024 measured use, and Budzyn 2025 suggests deskilling from a before-after comparison. No study reaches patient outcomes (K4).&quot;, &quot;evidence&quot;: [&quot;smith2026&quot;, &quot;grolleau2026&quot;, &quot;garcia2024&quot;, &quot;budzyn2025&quot;], &quot;angle&quot;: &quot;drafts-that-ship&quot;}]}, &quot;angles&quot;: {&quot;written&quot;: &quot;2026-11-25&quot;, &quot;note&quot;: &quot;Effect sizes, participation and ICC are planning assumptions, not expected results.&quot;, &quot;planning_assumptions&quot;: [&quot;About 36 residents (12 per class); planning assumes 24 to 30 complete any one session (70 to 85 percent participation). Assumption.&quot;, &quot;About 12 to 20 faculty would take the faculty form. Assumption: check the faculty roster.&quot;, &quot;Baseline catch rates of 40 to 50 percent and a 20-point difference are placeholders for planning only, not expected results. Replace them with the observed numbers from the first session.&quot;, &quot;Within-reader correlation (ICC) of 0.1 between a reader&#x27;s case results, with 0.2 as a pessimistic check. Assumption.&quot;, &quot;Two-proportion sample sizes use the standard normal approximation (alpha 0.05 two-sided, power 0.80), inflated by a design effect of 1 + (cases per reader - 1) x ICC.&quot;], &quot;angles&quot;: [{&quot;id&quot;: &quot;cross-type-catch-rate&quot;, &quot;rank&quot;: 1, &quot;title&quot;: &quot;Same resident, four kinds of AI: how often are planted errors caught?&quot;, &quot;question&quot;: &quot;When an FM resident reviews AI output that is sometimes wrong, how often do they catch a planted error in an LLM differential, an AI-drafted note or message, an image classifier read, and a risk-calculator result, and how often do they flag correct output as wrong?&quot;, &quot;design&quot;: &quot;Within-subject reader study on frozen synthetic stimuli (every reader sees identical AI output; nothing is generated live). 24 cases per reader, 6 per AI type, in random order. In each type 4 cases carry one planted error and 2 are correct, so false alarms can be measured. For every case: the resident commits their own answer and confidence first, then sees the AI output, then accepts, edits or flags it (marking where the error is) with a 0 to 100 confidence, then sees the key. Readers are told up front that some outputs contain errors (no deception). Two matched parallel forms (A and B) are built; each resident gets one at random, and the unused form becomes the post-test for the curriculum study.&quot;, &quot;arms&quot;: [&quot;Single group; within-subject factors: AI type (LLM differential, documentation draft, image classifier, calculator) x error present or absent&quot;, &quot;Form A vs Form B assigned at random (counterbalancing only, not a comparison of interest)&quot;], &quot;n_at_one_program&quot;: &quot;All ~36 residents invited; plan on 24 to 30 completing (assumption), 24 cases each in one 45 to 50 minute didactic slot. Planning calculation in plain words: with 30 residents, each AI type yields about 120 planted-error reads (30 x 4). Treating reads within a person as correlated (ICC 0.1, assumption), that behaves like about 100 independent reads per type, enough to estimate a type&#x27;s catch rate within roughly plus or minus 10 percentage points. Comparing two types is a within-person comparison, so it is at least as efficient as two independent groups of that size; a conservative independent-groups approximation says a gap of about 20 percentage points between two types is detectable at 80 percent power. Smaller gaps between types will be reported with intervals, not claimed. Faculty (12 to 20, assumption) take the same form for the resident-versus-faculty comparison.&quot;, &quot;primary_outcome&quot;: &quot;Catch rate by AI type: planted errors that the reader flagged at the right location and corrected, divided by planted errors shown.&quot;, &quot;secondary_outcomes&quot;: [&quot;False-alarm rate: correct AI outputs the reader flagged or changed&quot;, &quot;Signal-detection sensitivity (d&#x27;) and response bias, so &#x27;flag everything&#x27; is not mistaken for skill&quot;, &quot;Net effect of AI on the final answer vs the reader&#x27;s own committed answer: right-to-wrong switches when AI is wrong, wrong-to-right switches when AI is right&quot;, &quot;Confidence calibration of the accept/flag decision: Brier score and ECE with Jeffreys intervals per bin and a null-ECE noise floor&quot;, &quot;Which error types slip through most (taxonomy below)&quot;, &quot;Time per case; catch rate by PGY year; self-reported AI use and AI training as covariates&quot;], &quot;outcome_level&quot;: &quot;Modified Kirkpatrick K2b (skill, measured on simulated cases). No intervention, so this is a descriptive baseline and the pre-test for the curriculum study.&quot;, &quot;what_is_new&quot;: &quot;Every study in this set that tests error detection uses one kind of AI (Jabbour 2023 a biased model, Dratsch 2023 radiologists, Zhou 2025 ChatGPT-4o answers to GP trainees). None puts LLM, documentation, image and calculator errors in front of the same trainee and counts false alarms beside catches, and no study in this set tests calculators.&quot;, &quot;timeline&quot;: &quot;Weeks 1 to 3 (to about Dec 15): write 48 cases and complete faculty key review; submit for exempt determination in week 2. Weeks 2 to 5: build the review screen and export; item-quality pilot with a few chief residents (not study data). First resident data: late December at the earliest, more realistically January to February 2027 once the exemption is back and didactics resume after the holidays. For STFM Jan 4 2027, a design-and-pilot abstract is feasible; a results abstract by Jan 4 is feasible only if the exemption returns by mid-December and a session runs before the holidays. Results would then be ready to present in May 2027 if accepted.&quot;, &quot;irb&quot;: &quot;Likely exempt research, not QI: the aim is generalizable knowledge, and synthetic cases in a didactic fit the exemption categories for normal educational practice and educational tests (45 CFR 46.104(d)(1) and (d)(2)). The IRB makes the call. Because the program director is a study partner and supervises the participants: voluntary participation with an opt-out of data use that does not affect the didactic, study IDs held by someone outside the evaluation chain, the program director sees only aggregates, and results are never used in resident evaluations.&quot;, &quot;risks&quot;: [&quot;Planted errors that are too obvious or too obscure (floor or ceiling); item analysis and the chief-resident pilot address it&quot;, &quot;Telling readers that errors exist makes them more vigilant than in real practice; report catch rates as an upper bound on everyday vigilance&quot;, &quot;AI type is tangled with case difficulty; match difficulty across types and model case as a random effect&quot;, &quot;Residents share cases between sessions; use parallel forms and run each form in one sitting&quot;, &quot;Stimuli age as models change; frame the study around error types, not a benchmark of a named model&quot;, &quot;Small n: report intervals and avoid between-PGY claims the numbers cannot carry&quot;], &quot;tags&quot;: [&quot;jan&quot;, &quot;residents&quot;, &quot;bank&quot;]}, {&quot;id&quot;: &quot;resident-vs-attending&quot;, &quot;rank&quot;: 2, &quot;title&quot;: &quot;Residents vs attendings on the same planted errors&quot;, &quot;question&quot;: &quot;Do attendings catch more planted AI errors than residents, and does experience protect against being pulled off a correct answer by wrong AI, across all four AI types?&quot;, &quot;design&quot;: &quot;Cross-sectional comparison on the same bank and review screen as Study 1. Faculty take a form at a faculty development session; residents&#x27; data come from the baseline session. Groups: PGY-1, PGY-2, PGY-3, faculty. The key measure is susceptibility: cases where the reader&#x27;s own committed answer was right but the final answer followed the wrong AI.&quot;, &quot;arms&quot;: [&quot;Residents by PGY year&quot;, &quot;Faculty (attendings)&quot;], &quot;n_at_one_program&quot;: &quot;About 30 residents and 12 to 20 faculty completing (assumptions), 24 cases each. Planning calculation in plain words: with 30 residents and 15 faculty at 24 cases each and ICC 0.1 (assumption), the smallest resident-faculty difference in catch rate detectable at 80 percent power is about 17 percentage points (about 15 points with 20 faculty, about 18 points with 12). A smaller real gap would be missed, so the paper states the detectable difference up front and reports intervals. Comparisons between single PGY classes (about 10 each) are descriptive only. These detectable gaps are for catch rate; the gap for the primary outcome, susceptibility, will be stated once baseline rates are known.&quot;, &quot;primary_outcome&quot;: &quot;Susceptibility to wrong AI: proportion of wrong-AI cases where the reader&#x27;s own answer was correct and the final answer followed the AI.&quot;, &quot;secondary_outcomes&quot;: [&quot;Catch rate and false-alarm rate by group and AI type&quot;, &quot;Benefit from correct AI (wrong-to-right switches) by group&quot;, &quot;Calibration of confidence (Brier, ECE) by group&quot;, &quot;Self-reported AI use and AI training as covariates&quot;], &quot;outcome_level&quot;: &quot;K2b (skill on simulated cases), cross-sectional&quot;, &quot;what_is_new&quot;: &quot;Dratsch 2023 found that with wrong AI, correct reads fell to 19.8 percent in inexperienced and 45.5 percent in very experienced radiologists, and Gaube 2021 found radiologists rated AI advice lower while non-experts did not; no study in this set compares FM residents with their own attendings across AI types.&quot;, &quot;timeline&quot;: &quot;Faculty session can run in the same month as the resident baseline (January to February 2027); adds no build time. Same STFM Jan 4 position as the baseline: design-and-pilot abstract, results for May if data arrive in time.&quot;, &quot;irb&quot;: &quot;Same exemption reasoning as the baseline. Faculty are subjects too: their data are reported only in aggregate, never shared with the chair or used in faculty review.&quot;, &quot;risks&quot;: [&quot;Low faculty turnout; schedule inside an existing faculty meeting&quot;, &quot;Faculty may decline for fear of looking worse than residents; promise aggregate-only reporting&quot;, &quot;Experience is tangled with AI familiarity; collect AI use and training (Barr 2026: 71.1 percent of 15,259 FM residents used AI, 36 percent had training)&quot;, &quot;Too few faculty to detect a modest gap&quot;], &quot;tags&quot;: [&quot;jan&quot;, &quot;attendings&quot;, &quot;bank&quot;]}, {&quot;id&quot;: &quot;teach-and-transfer&quot;, &quot;rank&quot;: 3, &quot;title&quot;: &quot;Teach error-catching and test it on cases never seen&quot;, &quot;question&quot;: &quot;Does a planted-error curriculum raise residents&#x27; catch rate on unseen cases and on error types not taught, without raising false alarms, and does the gain last about three months?&quot;, &quot;design&quot;: &quot;Randomized delayed-start (waitlist) trial at the resident level, stratified by PGY year. Everyone takes the baseline form; group 1 takes the curriculum first, then both groups take the other parallel form; group 2 then takes the curriculum. Post-test cases are all unseen and include held-out error types (far transfer). Retention form at about three months. Class-level randomization is not used because three classes are too few clusters.&quot;, &quot;arms&quot;: [&quot;Immediate curriculum&quot;, &quot;Delayed curriculum (usual didactics first, then the curriculum)&quot;], &quot;n_at_one_program&quot;: &quot;36 residents randomized, about 15 per group completing (assumption). Planning calculation in plain words: for the between-group comparison at the first post-test, about 14 to 15 residents per group with 16 planted-error reads each (ICC 0.1, assumption) gives 80 percent power for a 20-point difference in catch rate (planning placeholder, e.g. 40 vs 60 percent); with ICC 0.2 it would need about 23 per group, more than one program has, so the pre-post within-person change is the co-primary analysis. With 30 residents completing both tests, the within-person design has 80 percent power to detect a change of about half a standard deviation of the per-resident catch rate. Replace the placeholders with baseline values before finalizing.&quot;, &quot;primary_outcome&quot;: &quot;Catch rate on unseen planted errors at the first post-test, immediate vs delayed group.&quot;, &quot;secondary_outcomes&quot;: [&quot;False-alarm rate (the curriculum must not just teach suspicion)&quot;, &quot;d&#x27; and response bias&quot;, &quot;Near transfer (taught error types) vs far transfer (held-out types)&quot;, &quot;Brier score and ECE of accept/flag confidence&quot;, &quot;Retention of catch rate at about three months&quot;, &quot;Unaided accuracy on the reader&#x27;s own committed answer, as a deskilling check (Budzyn 2025: non-AI adenoma detection fell from 28.4 to 22.4 percent after AI exposure)&quot;, &quot;Learner reaction and time per case&quot;], &quot;outcome_level&quot;: &quot;K2b primary; K1 and K2a secondary; K3 only if a later audit of real AI-drafted notes is added&quot;, &quot;what_is_new&quot;: &quot;Tolentino 2024&#x27;s scoping review found no AI curriculum that named a guiding theory; Feigerlova 2025 and Lai 2026 found no AI education study above Kirkpatrick level 2. The closest resident workshop (Stephenson 2026) measured only self-reported confidence. Qazi 2026 trained everyone and wrong AI still cut accuracy. No curriculum has been tested by catch rate on unseen cases.&quot;, &quot;timeline&quot;: &quot;Depends on the baseline. Pre-test January to February 2027; group 1 curriculum February to March; post-test April; group 2 curriculum April to May. PGY-3s graduate in June, so three-month retention for the first cohort may need to start fresh with the July 2027 class. First curriculum data spring 2027; STFM Jan 4 2027 can carry the curriculum design, with outcomes aimed at STFM 2028.&quot;, &quot;irb&quot;: &quot;Likely exempt research (normal educational practice: every resident gets the curriculum, the delay only orders it). If the IRB views randomizing the timing as beyond normal practice, expect expedited review. Same coercion protections as the baseline.&quot;, &quot;risks&quot;: [&quot;Contamination: immediate-group residents share cases with the delayed group&quot;, &quot;Testing effect from repeated forms; parallel forms and an untaught-type subscale help separate it&quot;, &quot;Attrition through nights and away rotations&quot;, &quot;PGY-3 graduation before retention testing&quot;, &quot;Over-correction: more false alarms (Gaube 2026 studied under-reliance as well as over-reliance)&quot;], &quot;tags&quot;: [&quot;teaches&quot;, &quot;residents&quot;, &quot;bank&quot;]}, {&quot;id&quot;: &quot;drafts-that-ship&quot;, &quot;rank&quot;: 4, &quot;title&quot;: &quot;AI-drafted notes and patient messages: which errors get signed or sent?&quot;, &quot;question&quot;: &quot;When residents edit and sign AI-drafted note sections and hospital course summaries, or edit and send AI-drafted portal replies, what share of planted errors survives into the signed or sent version, and which kinds survive most?&quot;, &quot;design&quot;: &quot;Simulated sign-and-send task. Each resident gets about 12 frozen drafts (4 note sections, 4 hospital course summaries, 4 patient portal replies) with zero to two planted errors at known sentence spans, beside the synthetic chart they came from. The task is the real one (edit until you would sign or send), not &#x27;find the error&#x27;. The submitted text is compared with the planted spans. Optional second pass: the same drafts reviewed with an explicit checklist, to see what the checklist adds.&quot;, &quot;arms&quot;: [&quot;Within-subject: draft kind (note, summary, portal reply) x error kind&quot;, &quot;Optional: plain review vs checklist review (crossover, counterbalanced)&quot;], &quot;n_at_one_program&quot;: &quot;About 30 residents x 12 drafts = 360 drafts; at about 18 planted errors per resident (assumption) that is about 540 planted errors. Planning calculation in plain words: allowing for within-reader correlation (ICC 0.1, assumption), the overall survival rate is estimated within roughly plus or minus 7 percentage points; rates for each draft kind within roughly plus or minus 9 points. That is enough to describe which kinds slip through, not to compare small differences.&quot;, &quot;primary_outcome&quot;: &quot;Error survival: planted errors still present in the signed or sent text, divided by planted errors.&quot;, &quot;secondary_outcomes&quot;: [&quot;Survival by error kind (fabrication, omission, contradiction of the chart, unsafe advice)&quot;, &quot;New errors introduced by the resident&#x27;s edits&quot;, &quot;Correct content wrongly deleted&quot;, &quot;Time to sign or send&quot;, &quot;Confidence that the draft was safe, and its calibration&quot;, &quot;Effect of the checklist pass, if run&quot;], &quot;outcome_level&quot;: &quot;K2b (simulated workplace task). Moves toward K3 only with a later, separately approved audit of real AI-scribe notes.&quot;, &quot;what_is_new&quot;: &quot;Error rates in LLM summaries are documented (Williams 2025: 42 percent of GPT-4 ED summaries had hallucinations, 47 percent omissions). Small 2025 found time-limited IM residents edited LLM hospital courses less than physician-written ones, and more confabulations remained; Chen 2024 found attendings&#x27; edited portal replies converged on the AI draft. Neither planted known errors, so no one has counted what share of known errors FM residents sign or send.&quot;, &quot;timeline&quot;: &quot;Build 4 to 6 weeks after the baseline review screen exists; data spring 2027. STFM Jan 4 2027 is not realistic for results; aim at STFM 2028.&quot;, &quot;irb&quot;: &quot;Likely exempt if residents are told the study is about reviewing AI drafts. If the design withholds that errors were planted, that is incomplete disclosure: the exemption for benign interventions allows it only if subjects agree in advance to not being told everything, otherwise expect expedited review with a debrief. IRB decides.&quot;, &quot;risks&quot;: [&quot;Scoring partial fixes is ambiguous; write the rule before data&quot;, &quot;Drafts that feel artificial lower engagement&quot;, &quot;Time burden: 12 drafts may take more than one didactic slot&quot;, &quot;Disclosure framing changes vigilance; report it&quot;], &quot;tags&quot;: [&quot;residents&quot;, &quot;build&quot;]}, {&quot;id&quot;: &quot;commit-first&quot;, &quot;rank&quot;: 5, &quot;title&quot;: &quot;Own answer first vs AI first: does committing protect against wrong AI?&quot;, &quot;question&quot;: &quot;Does committing to your own answer before seeing AI output, compared with seeing the AI first, reduce being pulled off a correct answer by wrong AI without losing the benefit of correct AI?&quot;, &quot;design&quot;: &quot;Within-subject randomized crossover: about 20 cases per resident, half shown own-answer-first and half AI-first, order and case assignment counterbalanced; half the AI outputs wrong. Can run as a second session after the baseline (the baseline uses own-answer-first throughout).&quot;, &quot;arms&quot;: [&quot;Own answer first, then AI&quot;, &quot;AI first, then answer&quot;], &quot;n_at_one_program&quot;: &quot;About 30 residents x 20 cases (assumption). Planning calculation in plain words: because each resident serves as their own control, 30 residents give 80 percent power to detect a within-person difference in susceptibility of about half a standard deviation; translating that into percentage points needs the spread seen at baseline, so the number is set after the first session.&quot;, &quot;primary_outcome&quot;: &quot;Susceptibility to wrong AI by order condition.&quot;, &quot;secondary_outcomes&quot;: [&quot;Benefit from correct AI by order&quot;, &quot;Final accuracy and time per case&quot;, &quot;Confidence calibration by order&quot;], &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;what_is_new&quot;: &quot;Yang 2026 had 32 anesthesiology residents decide first, then consult an LLM, but planted no errors, so it cannot say whether committing protects against wrong advice. Xu 2026 suggests showing the AI answer first may strengthen anchoring, and Jabbour 2023 found explanations did not rescue clinicians from a biased model. The protective effect of committing first is untested.&quot;, &quot;timeline&quot;: &quot;Second session after the baseline, spring 2027. Not a Jan 4 2027 results abstract.&quot;, &quot;irb&quot;: &quot;Likely exempt research (educational test with synthetic cases).&quot;, &quot;risks&quot;: [&quot;Carryover and order effects within a session&quot;, &quot;Committing first takes longer, which can look like the benefit&quot;, &quot;Overlaps with the curriculum habit it might later become&quot;], &quot;tags&quot;: [&quot;residents&quot;, &quot;bank&quot;]}, {&quot;id&quot;: &quot;derm-classifier-arm&quot;, &quot;rank&quot;: 6, &quot;title&quot;: &quot;Dermatology: wrong AI labels on skin photos&quot;, &quot;question&quot;: &quot;When an image classifier&#x27;s label on a skin photo is wrong, how often do residents and faculty follow it, and does a short derm teaching session change that?&quot;, &quot;design&quot;: &quot;The image arm of the same bank, run two ways: (1) as the image items in the baseline forms; (2) as one item a day through the existing daily image format over about 8 weeks, each photo carrying a synthetic AI label with a confidence number, wrong on a planted subset. Readers commit their own diagnosis first, then see the label, then decide.&quot;, &quot;arms&quot;: [&quot;Within-subject: label correct vs label wrong&quot;, &quot;Optional: before vs after a short derm teaching session&quot;], &quot;n_at_one_program&quot;: &quot;Up to ~36 residents plus faculty, about 40 daily items each if engagement holds (assumption). Precedent: the program&#x27;s existing daily case format has 752 attempts from 46 people over 142 cases. Planning calculation in plain words: with 25 regular players and about 15 wrong-label items each (ICC 0.1, assumption), the follow rate of wrong labels is estimated within roughly plus or minus 10 percentage points.&quot;, &quot;primary_outcome&quot;: &quot;Follow rate of wrong labels (reader&#x27;s own diagnosis was right but final answer followed the wrong label).&quot;, &quot;secondary_outcomes&quot;: [&quot;Catch rate and false alarms&quot;, &quot;Change after the derm module&quot;, &quot;Engagement over 8 weeks (from daily answers)&quot;, &quot;Resident vs faculty&quot;], &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;what_is_new&quot;: &quot;The experience gradient with wrong AI is shown for radiology readers (Dratsch 2023; Gaube 2021) but not, in this set, for FM trainees reading skin photos, and a daily format gives repeated measures a one-off session cannot.&quot;, &quot;timeline&quot;: &quot;Fastest to start once keys are reviewed: items could run in January 2027. It strengthens the baseline&#x27;s image arm.&quot;, &quot;irb&quot;: &quot;Likely exempt; openly licensed images, no patients, same coercion protections.&quot;, &quot;risks&quot;: [&quot;Answer keys still need faculty review&quot;, &quot;Synthetic labels must look like a real classifier&#x27;s output&quot;, &quot;Daily engagement may fade&quot;, &quot;Unknown skin-tone coverage in the photo set&quot;], &quot;tags&quot;: [&quot;jan&quot;, &quot;attendings&quot;, &quot;teaches&quot;, &quot;bank&quot;]}], &quot;recommendation&quot;: {&quot;pick&quot;: &quot;cross-type-catch-rate&quot;, &quot;why&quot;: &quot;One bank and one review screen produce the baseline, the resident-vs-attending comparison (faculty take the same form) and the pre-test for the curriculum trial, so the first build pays for three papers. This one build also yields data for Studies 2, 3 and 6, with a design-and-pilot abstract by the STFM Jan 4 2027 deadline.&quot;, &quot;first_90_days&quot;: [&quot;Week 1: agree on the question, the error taxonomy and the 4 x 6 case blueprint; name a non-supervising person to hold the study-ID key&quot;, &quot;Weeks 1 to 3: write 48 synthetic cases (Forms A and B) with frozen AI outputs; faculty review each key with Keep / Fix / Cut&quot;, &quot;Week 2: submit for exempt determination with a drafted protocol (QI-versus-research determination, sample-size section)&quot;, &quot;Weeks 2 to 5: build the review screen (AI output with tap-to-flag sentences) and the export on the existing case screen and server-side grading&quot;, &quot;Week 5: item-quality pilot with chief residents (not study data); drop or fix items everyone gets or no one gets&quot;, &quot;By Jan 4 2027: submit an STFM design-and-pilot abstract (results only if the exemption and a session land before the holidays)&quot;, &quot;January to February 2027: resident baseline session in didactics; faculty session at faculty development&quot;, &quot;February 2027: analysis with a mixed-effects model; use the observed catch and false-alarm rates to finalize sample sizes for the curriculum trial and start module 1&quot;]}}, &quot;curriculum&quot;: {&quot;title&quot;: &quot;Catching AI errors: a planted-error curriculum for family medicine&quot;, &quot;goal&quot;: &quot;Residents use clinical AI output while reliably catching its errors, without rejecting correct output, and know how sure to be of their own check.&quot;, &quot;objectives&quot;: [&quot;Flag and correct planted errors in unseen AI output at a catch rate above the resident&#x27;s own baseline, across LLM differentials, documentation drafts, image classifier reads and calculator results&quot;, &quot;Keep the false-alarm rate on correct AI output at or below baseline while catch rate rises&quot;, &quot;Commit to an independent answer before reading AI output on every case in the assessment set&quot;, &quot;Trace every fact an AI draft states (results, meds, allergies, history) to the chart before signing, and name any omitted pending result, held medication or follow-up&quot;, &quot;Check each calculator input&#x27;s source and date and whether the patient fits the calculator before acting on its result&quot;, &quot;State a confidence for each accept or flag decision whose Brier score and ECE improve from pre- to post-test&quot;, &quot;Name the error type (from the taxonomy) for each planted error caught&quot;], &quot;modules&quot;: [{&quot;n&quot;: 1, &quot;title&quot;: &quot;Why we miss AI errors&quot;, &quot;minutes&quot;: 30, &quot;format&quot;: &quot;Short evidence talk, then a 3-case warm-up on the review screen&quot;, &quot;core_idea&quot;: &quot;Wrong AI pulls good clinicians off correct answers, and explanations do not fix it (Jabbour 2023: accuracy fell 11.3 points with a biased model, 9.1 with explanations); experience helps only partly (Dratsch 2023); relying on AI may erode unaided skill (observational before-after, Budzyn 2025). The habit taught here: your own answer first, then the AI.&quot;, &quot;exercise&quot;: &quot;Synthetic case: 64-year-old woman with 3 days of dyspnea, heart rate 112, one-sided calf swelling, COPD on the problem list. Resident commits a top three and confidence. AI output: &#x27;COPD exacerbation 80 percent; start prednisone and nebulizers&#x27;, with PE absent from the list (planted omission of a must-not-miss). Resident accepts, edits or flags, then sees the key and their own switch, if any.&quot;, &quot;error_types_taught&quot;: [&quot;Omission&quot;, &quot;Wrong leading diagnosis or missed must-not-miss&quot;, &quot;Reader-side: deskilling&quot;], &quot;assessment&quot;: &quot;Warm-up results shown back to the resident (own answer vs final answer); not graded&quot;, &quot;lead&quot;: &quot;Brad Perkins&quot;}, {&quot;n&quot;: 2, &quot;title&quot;: &quot;LLM diagnostic suggestions&quot;, &quot;minutes&quot;: 45, &quot;format&quot;: &quot;Small-group case set (6 cases), debrief by error type&quot;, &quot;core_idea&quot;: &quot;An LLM differential reads fluent and can state facts that are not in the chart or anchor on a biased framing (Schmidt 2025 compared ChatGPT with 265 residents on bias-inducing cases; Goh 2024 found GPT-4 access did not improve physicians&#x27; diagnostic reasoning, 76 vs 74 percent). Check every fact it cites, then sweep for what would kill the patient.&quot;, &quot;exercise&quot;: &quot;Synthetic case: 52-year-old man, smoker with type 2 diabetes, two weeks of burning after meals and one episode of sweating while climbing stairs; no troponin has been drawn. AI output: &#x27;Most likely GERD (75 percent). Troponin negative, ACS unlikely. Start a PPI trial.&#x27; Planted errors: a fabricated troponin result and an exertional symptom ignored. Key: the troponin claim is unsupported; exertional symptoms in this patient keep ACS on the list and change the next step.&quot;, &quot;error_types_taught&quot;: [&quot;Fabricated fact&quot;, &quot;Wrong leading diagnosis or missed must-not-miss&quot;, &quot;Systematically biased suggestion&quot;], &quot;assessment&quot;: &quot;Catch rate and false alarms on the 6-case set; each caught error labeled by type&quot;, &quot;lead&quot;: &quot;Brad Perkins&quot;}, {&quot;n&quot;: 3, &quot;title&quot;: &quot;AI-drafted notes and hospital course summaries&quot;, &quot;minutes&quot;: 45, &quot;format&quot;: &quot;Edit-and-sign exercise beside the synthetic chart, then compare with the key&quot;, &quot;core_idea&quot;: &quot;AI summaries both invent and leave things out (Williams 2025: 42 percent of GPT-4 ED summaries had hallucinations, 47 percent omissions, 33 percent error-free). Read the draft against the source, not on its own: meds, pending results, allergies, follow-up.&quot;, &quot;exercise&quot;: &quot;Synthetic case: 78-year-old woman admitted for heart failure exacerbation; MAR shows apixaban held for a GI bleed; a blood culture is pending; no allergies recorded. AI hospital course summary: &#x27;Apixaban continued. No pending studies. Penicillin allergy noted.&#x27; Planted errors: contradicts the chart (apixaban), omission (pending culture), fabricated fact (allergy). Resident edits until they would sign.&quot;, &quot;error_types_taught&quot;: [&quot;Contradicts the chart&quot;, &quot;Omission&quot;, &quot;Fabricated fact&quot;], &quot;assessment&quot;: &quot;Error survival in the signed text; new errors introduced by editing&quot;, &quot;lead&quot;: &quot;Brad Perkins&quot;}, {&quot;n&quot;: 4, &quot;title&quot;: &quot;AI-drafted patient messages&quot;, &quot;minutes&quot;: 30, &quot;format&quot;: &quot;Simulated in-basket: 4 portal replies to edit and send&quot;, &quot;core_idea&quot;: &quot;A patient-facing draft can be kind in tone and unsafe in content. Screen for red flags and for medication changes before you judge the wording.&quot;, &quot;exercise&quot;: &quot;Synthetic message: &#x27;My chest feels tight when I walk the dog and my home BP was 168/98. Should I double my lisinopril?&#x27; AI draft: &#x27;Yes, you can take an extra 10 mg tonight. This is common and not concerning.&#x27; Planted errors: unsafe reassurance that misses exertional chest symptoms, and a dose change made without checking the chart. Key: the reply should direct same-day evaluation and not change the dose by message.&quot;, &quot;error_types_taught&quot;: [&quot;Unsafe advice or reassurance in a patient-facing draft&quot;, &quot;Contradicts the chart&quot;], &quot;assessment&quot;: &quot;Error survival in sent replies; time per reply&quot;, &quot;lead&quot;: &quot;Brad Perkins&quot;}, {&quot;n&quot;: 5, &quot;title&quot;: &quot;AI in dermatology: image classifiers on skin photos&quot;, &quot;minutes&quot;: 45, &quot;format&quot;: &quot;Presented by Dr. Wilson: describe the lesion first, then see the AI label, then decide&quot;, &quot;core_idea&quot;: &quot;A high confidence number on an image label is not evidence. Describe the lesion and decide on its features before reading the label; with wrong labels even experienced readers follow them (Dratsch 2023; Gaube 2021).&quot;, &quot;exercise&quot;: &quot;Openly licensed photo of a pigmented lesion on the sole of a 60-year-old: asymmetric, irregular border, several colors, larger than 6 mm. AI label: &#x27;Benign acral nevus, 93 percent confidence.&#x27; Planted error: wrong label on a lesion whose features warrant biopsy. Second item: a correct label (&#x27;tinea corporis&#x27;) on a typical ring-shaped scaly plaque, to measure false alarms.&quot;, &quot;error_types_taught&quot;: [&quot;Wrong image label stated with high confidence&quot;, &quot;Reader-side: false alarm or under-reliance&quot;], &quot;assessment&quot;: &quot;Follow rate of wrong labels; false alarms on correct labels&quot;, &quot;lead&quot;: &quot;Dr. Lane Wilson&quot;}, {&quot;n&quot;: 6, &quot;title&quot;: &quot;Risk calculators and the mixed set&quot;, &quot;minutes&quot;: 45, &quot;format&quot;: &quot;Calculator exercise (15 min), then a mixed 8-case set across all four AI types with confidence ratings and a calibration readout (30 min)&quot;, &quot;core_idea&quot;: &quot;A calculator is only as right as its inputs and only applies to the patient it was built for. Then put it together: trust when your check agrees, stop and verify when it does not, and keep a specific reason for every override so correct AI is not rejected.&quot;, &quot;exercise&quot;: &quot;Synthetic case: 58-year-old man with amlodipine on his med list and a total cholesterol from 2019 and one from this month. An AI assistant fills PREVENT using the 2019 cholesterol and marks &#x27;not on blood pressure treatment&#x27;, reports a low 10-year risk and suggests no statin discussion. Planted errors: a stale input and a wrong input. Key: rerun with this month&#x27;s value and treated BP; the result and the discussion change. Mixed set: 8 new cases (2 per AI type, some correct), confidence 0 to 100 on each decision, then each resident sees their own Brier score and calibration curve.&quot;, &quot;error_types_taught&quot;: [&quot;Wrong or stale calculator input&quot;, &quot;Calculator used outside the population it was built for&quot;, &quot;Reader-side: false alarm or under-reliance&quot;], &quot;assessment&quot;: &quot;Mixed-set catch rate, false alarms, Brier and ECE shown back to the resident&quot;, &quot;lead&quot;: &quot;Brad Perkins&quot;}], &quot;assessment_plan&quot;: &quot;Pre/post transfer test on unseen cases: Forms A and B (24 cases each, 6 per AI type, 4 with a planted error and 2 correct per type), assigned in counterbalanced order so each resident&#x27;s post-test is the form they have not seen; each form holds some error types not taught in the modules to test far transfer. Per case the resident commits an own answer and confidence, then accepts, edits or flags the AI output and rates confidence 0 to 100. Scored: catch rate of planted errors (right location and correction), false-alarm rate on correct outputs, d&#x27; and response bias, error survival for drafts, susceptibility (right-to-wrong switches) and benefit (wrong-to-right switches). Calibration: Brier score and ECE of accept/flag confidence, with Jeffreys intervals per bin and a null-ECE noise floor so a small sample is not over-read. Delayed retention on a third form at about three months. Unaided accuracy on the committed own answer tracked across all three tests as a deskilling check. Analysis: mixed-effects logistic models with reader and case random effects; delayed-start group as the concurrent control.&quot;, &quot;faculty_track&quot;: &quot;Faculty take a parallel form first, at a faculty development session, which supplies the resident-vs-attending data and shows faculty where they themselves get pulled. Brad Perkins leads the session and a 120-minute condensed version (modules 1, 3 and 6 with the mixed set); Dr. Wilson presents the dermatology segment. Faculty who finish can co-lead small-group debriefs and review case keys with Keep / Fix / Cut; Dr. Wilson reviews the dermatology keys. Faculty results are reported only in aggregate.&quot;, &quot;error_taxonomy&quot;: [{&quot;type&quot;: &quot;Fabricated fact&quot;, &quot;example&quot;: &quot;AI summary states &#x27;troponin negative&#x27; or &#x27;penicillin allergy&#x27; when neither is in the chart. Hallucinations were found in 42 percent of GPT-4 ED summaries (Williams 2025); Zhou 2025 tested GP trainees on ChatGPT-4o hallucinations.&quot;, &quot;how_to_catch&quot;: &quot;Trace every result, medication, allergy and history item the AI states back to its source in the chart.&quot;}, {&quot;type&quot;: &quot;Omission&quot;, &quot;example&quot;: &quot;Hospital course summary leaves out a pending blood culture; a differential leaves out PE. Omissions were found in 47 percent of GPT-4 ED summaries (Williams 2025).&quot;, &quot;how_to_catch&quot;: &quot;Read from the source to the draft as well as the draft to the source: meds held or started, pending results, follow-up, must-not-miss diagnoses.&quot;}, {&quot;type&quot;: &quot;Contradicts the chart&quot;, &quot;example&quot;: &quot;Draft says apixaban was continued; the MAR shows it held for a GI bleed. Chung 2026 found clinicians agreed with each other less than an EHR-grounded checker agreed with them.&quot;, &quot;how_to_catch&quot;: &quot;Check each stated action against the order record and MAR, not against memory.&quot;}, {&quot;type&quot;: &quot;Wrong leading diagnosis or missed must-not-miss&quot;, &quot;example&quot;: &quot;LLM ranks GERD first and ACS low in a smoker with exertional symptoms. GPT-4 access did not improve physicians&#x27; diagnostic reasoning in Goh 2024.&quot;, &quot;how_to_catch&quot;: &quot;Commit your own differential first; then ask what dangerous diagnosis is missing and what finding should have moved the probabilities.&quot;}, {&quot;type&quot;: &quot;Systematically biased suggestion&quot;, &quot;example&quot;: &quot;A model that is consistently wrong for one kind of patient. In Jabbour 2023 a biased model lowered clinicians&#x27; accuracy by 11.3 points, and explanations did not rescue it (9.1 points).&quot;, &quot;how_to_catch&quot;: &quot;Do not treat an explanation as proof; compare with your committed answer and notice when the AI is wrong in the same direction for similar patients. Schmidt 2025 used bias-inducing cases with residents and ChatGPT.&quot;}, {&quot;type&quot;: &quot;Wrong image label stated with high confidence&quot;, &quot;example&quot;: &quot;Classifier calls a pigmented sole lesion with worrying features &#x27;benign nevus, 93 percent&#x27;. Wrong AI cut radiologists&#x27; correct reads to 19.8 percent (inexperienced) and 45.5 percent (very experienced) in Dratsch 2023.&quot;, &quot;how_to_catch&quot;: &quot;Describe the lesion and decide on its features before reading the label; read the confidence number as the model&#x27;s, not as evidence.&quot;}, {&quot;type&quot;: &quot;Wrong or stale calculator input&quot;, &quot;example&quot;: &quot;PREVENT run with a 2019 cholesterol and &#x27;not on BP treatment&#x27; while amlodipine is on the med list.&quot;, &quot;how_to_catch&quot;: &quot;Check each input&#x27;s value, date and source line; rerun yourself when any input is unsure.&quot;}, {&quot;type&quot;: &quot;Calculator used outside the population it was built for&quot;, &quot;example&quot;: &quot;A risk score applied to a patient outside its age range or clinical setting, giving a number that looks precise but does not apply.&quot;, &quot;how_to_catch&quot;: &quot;Check the calculator&#x27;s eligibility (age, setting, inputs it requires) before reading the result.&quot;}, {&quot;type&quot;: &quot;Unsafe advice or reassurance in a patient-facing draft&quot;, &quot;example&quot;: &quot;Portal reply tells a patient with exertional chest tightness to double lisinopril and that it is not concerning.&quot;, &quot;how_to_catch&quot;: &quot;Screen for red flags and medication changes before editing tone; never let a message change a dose without a chart check.&quot;}, {&quot;type&quot;: &quot;Reader-side: false alarm or under-reliance&quot;, &quot;example&quot;: &quot;Resident overrides a correct AI label or edit out of general suspicion. Gaube 2026 studied both over- and under-reliance in radiologists and novices.&quot;, &quot;how_to_catch&quot;: &quot;Require a specific stated reason for every override; track your own false-alarm rate beside your catch rate.&quot;}, {&quot;type&quot;: &quot;Reader-side: deskilling&quot;, &quot;example&quot;: &quot;Unaided skill may drop after routine AI use: non-AI adenoma detection fell from 28.4 to 22.4 percent after AI exposure (Budzyn 2025).&quot;, &quot;how_to_catch&quot;: &quot;Keep making and scoring your own answer before the AI&#x27;s, and measure unaided performance over time.&quot;}], &quot;frameworks&quot;: [{&quot;id&quot;: &quot;aamc2025&quot;, &quot;body&quot;: &quot;AAMC&quot;, &quot;title&quot;: &quot;Principles for the Responsible Use of Artificial Intelligence in and for Medical Education&quot;, &quot;year&quot;: 2025, &quot;what_it_says_about_error_detection&quot;: &quot;Seven principles (version 2.0 completed July 31, 2025). The education principle says educators need skills to critically evaluate AI, &#x27;necessary to avoid complacency and ensure vigilance when AI automation becomes routine&#x27;; it sets no competency or assessment for catching wrong output.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;acgme_cpr2026&quot;, &quot;body&quot;: &quot;ACGME&quot;, &quot;title&quot;: &quot;Common Program Requirements (Residency), proposed revision posted for review and comment&quot;, &quot;year&quot;: 2026, &quot;what_it_says_about_error_detection&quot;: &quot;Posted September 8, 2026. AI appears only as an example under Professionalism (4.3, &#x27;use of technology (e.g., artificial intelligence)&#x27;) and Systems-Based Practice (4.9, &#x27;existing and emerging technologies (e.g., artificial intelligence)&#x27;); nothing on verifying AI output. Proposed, not in effect. No FM milestone on AI was found.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;stfm_aimpc&quot;, &quot;body&quot;: &quot;STFM&quot;, &quot;title&quot;: &quot;AI and Machine Learning for Primary Care (AiM-PC) Curriculum&quot;, &quot;year&quot;: 2025, &quot;what_it_says_about_error_detection&quot;: &quot;Free CME curriculum for students, residents, faculty and primary care physicians, final part released May 12, 2025, led by Liaw; includes a module titled &#x27;Evidence-Based Evaluation of AI-Based Tools&#x27;. The pages do not describe teaching recognition of wrong output and report no learner outcome data.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;stfm_taskforce&quot;, &quot;body&quot;: &quot;STFM&quot;, &quot;title&quot;: &quot;AI in Medical Education initiative and task force&quot;, &quot;year&quot;: 2025, &quot;what_it_says_about_error_detection&quot;: &quot;Task force plans an FM AI Playbook and AI Centers of Excellence recognition; no AI-specific STFM policy statement found. Only verification guidance is a tip for its own assistant to verify critical information.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;aafp_ethical_ai&quot;, &quot;body&quot;: &quot;AAFP&quot;, &quot;title&quot;: &quot;Ethical Application of Artificial Intelligence in Family Medicine&quot;, &quot;year&quot;: null, &quot;what_it_says_about_error_detection&quot;: &quot;Principles aimed at AI developers (safety, reliability, correctness; &#x27;evaluated with the same rigor as any other tool&#x27;); nothing on training physicians or residents to check output or on automation bias. Adoption date not shown on the page.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;ama_2025&quot;, &quot;body&quot;: &quot;AMA&quot;, &quot;title&quot;: &quot;Policy to advance AI literacy in medical education (House of Delegates Interim Meeting)&quot;, &quot;year&quot;: 2025, &quot;what_it_says_about_error_detection&quot;: &quot;Press release dated November 18, 2025: AMA will develop model AI learning objectives and curricular toolkits and work toward AI literacy elements; it does not mention evaluating AI output or overreliance. Policy text itself not read.&quot;, &quot;verified&quot;: &quot;web-page&quot;}, {&quot;id&quot;: &quot;liaw2022&quot;, &quot;body&quot;: &quot;academic&quot;, &quot;title&quot;: &quot;Liaw 2022 Ann Fam Med: competencies for the use of AI in primary care (PMID 36443071)&quot;, &quot;year&quot;: 2022, &quot;what_it_says_about_error_detection&quot;: &quot;Six domains, including critical appraisal (&#x27;should I use this tool?&#x27;) and awareness of unintended consequences; it is about appraising tools, not catching a single wrong output.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;russell2023&quot;, &quot;body&quot;: &quot;academic&quot;, &quot;title&quot;: &quot;Russell 2023 Acad Med: competencies for the use of AI-based tools by health care professionals (PMID 36731054)&quot;, &quot;year&quot;: 2023, &quot;what_it_says_about_error_detection&quot;: &quot;15 expert interviews, 6 domains, 25 subcompetencies; domain 4 is evidence-based evaluation of AI tools (&#x27;evaluate the quality, accuracy, safety, contextual appropriateness, and biases of AI-based tools&#x27;). No assessment method is attached.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;kewalramani2026&quot;, &quot;body&quot;: &quot;academic&quot;, &quot;title&quot;: &quot;Kewalramani 2026 Surgery: Society of University Surgeons position statement on AI in surgical training (PMID 41187419)&quot;, &quot;year&quot;: 2026, &quot;what_it_says_about_error_detection&quot;: &quot;Specialty society position statement; error-detection content not checked.&quot;, &quot;verified&quot;: &quot;title-only&quot;}, {&quot;id&quot;: &quot;feigerlova2026&quot;, &quot;body&quot;: &quot;academic&quot;, &quot;title&quot;: &quot;Feigerlova 2026 Clin Teach: pragmatic workflow framework for AI use in medical education (PMID 41954265)&quot;, &quot;year&quot;: 2026, &quot;what_it_says_about_error_detection&quot;: &quot;A workflow integrating &#x27;verification, critical appraisal and ethical reflection&#x27;; no evaluation data.&quot;, &quot;verified&quot;: &quot;abstract&quot;}], &quot;prior_curricula&quot;: [{&quot;id&quot;: &quot;stephenson2026&quot;, &quot;cite&quot;: &quot;Stephenson 2026 MedEdPORTAL&quot;, &quot;title&quot;: &quot;Beyond the Black Box: A 30-Minute AI Critical Appraisal Workshop for Internal Medicine Residents&quot;, &quot;year&quot;: 2026, &quot;journal&quot;: &quot;MedEdPORTAL&quot;, &quot;pmid&quot;: &quot;43041771&quot;, &quot;learners&quot;: &quot;residents&quot;, &quot;teaches_error_detection&quot;: true, &quot;what_taught&quot;: &quot;Prompting an LLM with a fictional case, comparing outputs, an appraisal framework for AI output&quot;, &quot;format&quot;: &quot;30-min workshop replacing one EBM journal club, PGY1-3, 6 sessions Jul-Dec 2025&quot;, &quot;outcome_level&quot;: &quot;K2a&quot;, &quot;finding&quot;: &quot;Self-reported confidence in critically appraising AI output rose from 60.4% to 79.5% and concern about inaccurate predictions from 69.8% to 88.6%; 90.5% rated it 4-5/5 (53 pre, 44 post surveys, unpaired). Appraisal skill itself was not tested.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;liu2026&quot;, &quot;cite&quot;: &quot;Liu 2026 JMIR Med Educ&quot;, &quot;title&quot;: &quot;3-hour GenAI workshop (clinical reasoning, cognitive-bias awareness, verification-oriented GenAI use, prompt engineering)&quot;, &quot;year&quot;: 2026, &quot;journal&quot;: &quot;JMIR Med Educ&quot;, &quot;pmid&quot;: &quot;42594250&quot;, &quot;learners&quot;: &quot;med-students&quot;, &quot;teaches_error_detection&quot;: true, &quot;what_taught&quot;: &quot;Verification-oriented GenAI use, cognitive-bias awareness, prompt engineering&quot;, &quot;format&quot;: &quot;3-h workshop, 6 modules, 5th-year students, 139/150 paired&quot;, &quot;outcome_level&quot;: &quot;K2a&quot;, &quot;finding&quot;: &quot;Self-perceived AI literacy improved (Cohen d 0.69-0.93); no performance measure.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;shiukashvili2026&quot;, &quot;cite&quot;: &quot;Shiukashvili 2026 J Med Educ Curric Dev&quot;, &quot;title&quot;: &quot;Performance-based rubric for generative AI use (Documentation, Prompt Generation, Verification, Integration)&quot;, &quot;year&quot;: 2026, &quot;journal&quot;: &quot;J Med Educ Curric Dev&quot;, &quot;pmid&quot;: &quot;42131574&quot;, &quot;learners&quot;: &quot;med-students&quot;, &quot;teaches_error_detection&quot;: false, &quot;what_taught&quot;: &quot;Assessment tool, not a curriculum&quot;, &quot;format&quot;: &quot;Rubric applied to observed GenAI use, 3rd-year students, n=50&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;finding&quot;: &quot;Verification domain mean 0.41 (SD 0.71) of 3; 60% of students scored 0 on Verification; ICC for Verification 0.93. Measures observed verification behavior, but no training was tested.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;agarwal2026&quot;, &quot;cite&quot;: &quot;Agarwal 2026 Cureus&quot;, &quot;title&quot;: &quot;Instruction in prompt engineering, AI verification and human-in-the-loop for MBBS students&quot;, &quot;year&quot;: 2026, &quot;journal&quot;: &quot;Cureus&quot;, &quot;pmid&quot;: &quot;42598310&quot;, &quot;learners&quot;: &quot;med-students&quot;, &quot;teaches_error_detection&quot;: true, &quot;what_taught&quot;: &quot;Prompt engineering, AI verification, human-in-the-loop&quot;, &quot;format&quot;: &quot;Instructional sessions, 83 MBBS students&quot;, &quot;outcome_level&quot;: &quot;K2b&quot;, &quot;finding&quot;: &quot;Rubric scores rose from 57.1% to 86.2%; 85% (n=71) self-reported routinely verifying AI content with textbooks. Detection of AI errors was not measured.&quot;, &quot;verified&quot;: &quot;abstract&quot;}, {&quot;id&quot;: &quot;wong2025&quot;, &quot;cite&quot;: &quot;Wong 2025 Acad Med&quot;, &quot;title&quot;: &quot;DATA-MD curriculum for internal medicine residents&quot;, &quot;year&quot;: 2025, &quot;journal&quot;: &quot;Acad Med&quot;, &quot;pmid&quot;: &quot;40378182&quot;, &quot;learners&quot;: &quot;residents&quot;, &quot;teaches_error_detection&quot;: false, &quot;what_taught security; no data.&quot;, &quot;verified&quot;: &quot;abstract&quot;}]}, &quot;unverified&quot;: [&quot;Some figures come from the paper&#x27;s abstract or full text beyond the quote saved in the data, so they were not re-checked against a saved quote.&quot;, &quot;Zhou 2025, the only FM-trainee study: its abstract and its table state the AI-familiarity finding in opposite directions. The page uses the table.&quot;, &quot;Agarwal 2023 has no PubMed record; it was read from the NBER abstract page only.&quot;, &quot;Stephenson 2026 (IM resident workshop): confidence figures were taken from the abstract, but no verbatim quote was saved.&quot;, &quot;Kewalramani 2026 framework was found by title only.&quot;, &quot;Smith 2026 reports what clinicians flagged in routine use, with no answer key; it is not a true error rate. Wang 2023&#x27;s reduction in automation bias is a modeled estimate.&quot;, &quot;The ACGME common program requirements that mention AI are a proposal posted 8 Sep 2026, not final.&quot;, &quot;Each study was coded onto the map by one reader, not two. Treat cell counts as approximate.&quot;, &quot;Every sample size, precision figure and timeline on this page is a planning assumption, not a result. The size of the UMKC resident and faculty pools has not been confirmed.&quot;]}&lt;/script&gt;

(function(){

 {t:&#x27;78-year-old woman admitted 11/19 with acute decompensated heart failure.&#x27;,err:false,why:&#x27;Matches the chart.&#x27;},

  &lt;div class=&quot;eyebrow&quot;&gt;Working brief · for Dr. Wilson and Brad Perkins&lt;/div&gt;
  &lt;h1&gt;Teaching residents to catch AI mistakes&lt;/h1&gt;
  &lt;p class=&quot;lede&quot;&gt;A short set of choices to make together, not a finished plan. Each choice shows what it gets us and what it costs. Tap a side, leave it open, or jot a note, and the column on the right adds up where we landed.&lt;/p&gt;
&lt;/header&gt;

&lt;section class=&quot;fixed&quot; aria-label=&quot;What is already settled&quot;&gt;
  &lt;div class=&quot;fx&quot;&gt;&lt;b&gt;The core idea&lt;/b&gt;Residents see AI output, some of it wrong, and decide before and after they see it. Then we teach the catch and measure it again.&lt;/div&gt;
  &lt;div class=&quot;fx&quot;&gt;&lt;b&gt;Why it matters&lt;/b&gt;Most AI teaching studies stop at &quot;learners felt more confident.&quot; Few measure whether anyone actually catches a wrong answer.&lt;/div&gt;
  &lt;div class=&quot;fx&quot;&gt;&lt;b&gt;Already built&lt;/b&gt;A decide-first reading screen, confidence scoring, and a dermatology trainer with a case library to draw from.&lt;/div&gt;
  &lt;div class=&quot;fx&quot;&gt;&lt;b&gt;Still to build&lt;/b&gt;The study case set, a screen to flag errors, and an export for analysis.&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;layout&quot;&gt;
  &lt;div class=&quot;decisions&quot; id=&quot;decisions&quot;&gt;&lt;/div&gt;

&lt;section class=&quot;ideas&quot;&gt;
  &lt;h2&gt;Ideas still on the table&lt;/h2&gt;
  &lt;p class=&quot;q&quot;&gt;Not decisions yet. Things either of us could pick up if one sparks.&lt;/p&gt;
  &lt;div class=&quot;idea-grid&quot;&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;A daily derm case with an AI read&lt;/b&gt;&lt;span&gt;One photo a day; sometimes the AI label is wrong. Builds the habit and the data at the same time.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;Faculty take it first&lt;/b&gt;&lt;span&gt;If attendings miss errors too, the story gets stronger and the teaching gets humbler.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;Residents write the errors&lt;/b&gt;&lt;span&gt;Making a convincing wrong answer may teach the catch better than spotting one.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;A &quot;how sure are you&quot; habit&lt;/b&gt;&lt;span&gt;Every answer comes with a confidence call, so we can show who is overconfident with AI.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;Share it with other programs&lt;/b&gt;&lt;span&gt;If the cases work here, they travel. A multi-site version is a bigger paper.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;idea&quot;&gt;&lt;b&gt;Patient-facing AI messages&lt;/b&gt;&lt;span&gt;Residents review AI-drafted portal replies before they go out. Close to real practice.&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

function rng(seed){return()=&gt;{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function fhrSvg(){
  const W=900,H=300,top=10,fh=190,th=70,gap=20,mins=10;
  const x=t=&gt;40+(t/mins)*(W-50);
  const yF=b=&gt;top+fh-((b-60)/(200-60))*fh;
  const yT=v=&gt;top+fh+gap+th-(v/100)*th;
  let g=&#x27;&#x27;;
  for(let m=0;m&lt;=mins;m+=0.5){const X=x(m);g+=`&lt;line x1=&quot;${X}&quot; y1=&quot;${top}&quot; x2=&quot;${X}&quot; y2=&quot;${top+fh}&quot; style=&quot;stroke:var(--mon-grid)&quot; stroke-width=&quot;${m%1?0.5:1}&quot;/&gt;&lt;line x1=&quot;${X}&quot; y1=&quot;${top+fh+gap}&quot; x2=&quot;${X}&quot; y2=&quot;${top+fh+gap+th}&quot; style=&quot;stroke:var(--mon-grid)&quot; stroke-width=&quot;${m%1?0.5:1}&quot;/&gt;`}
  for(let b=60;b&lt;=200;b+=10){const Y=yF(b);g+=`&lt;line x1=&quot;40&quot; y1=&quot;${Y}&quot; x2=&quot;${W-10}&quot; y2=&quot;${Y}&quot; style=&quot;stroke:var(--mon-grid)&quot; stroke-width=&quot;${b%30==0?1:0.5}&quot;/&gt;`;if(b%30==0)g+=`&lt;text x=&quot;34&quot; y=&quot;${Y+4}&quot; text-anchor=&quot;end&quot; font-size=&quot;10&quot; style=&quot;fill:var(--mon-label)&quot; font-family=&quot;JetBrains Mono,monospace&quot;&gt;${b}&lt;/text&gt;`}
  for(let v=0;v&lt;=100;v+=25){const Y=yT(v);g+=`&lt;line x1=&quot;40&quot; y1=&quot;${Y}&quot; x2=&quot;${W-10}&quot; y2=&quot;${Y}&quot; style=&quot;stroke:var(--mon-grid)&quot; stroke-width=&quot;0.5&quot;/&gt;`}
  g+=`&lt;text x=&quot;34&quot; y=&quot;${yT(50)+4}&quot; text-anchor=&quot;end&quot; font-size=&quot;10&quot; style=&quot;fill:var(--mon-label)&quot; font-family=&quot;JetBrains Mono,monospace&quot;&gt;UA&lt;/text&gt;`;
  const peaks=[1.4,4.4,7.4],r=rng(7);
  const cont=t=&gt;peaks.reduce((s,p)=&gt;s+70*Math.exp(-(((t-p)*60)**2)/(2*18**2)),0)+8;
  const decel=t=&gt;peaks.reduce((s,p)=&gt;{const n=p+0.55,d=(t-n)*60;return s+18*Math.exp(-(d*d)/(2*(d&lt;0?24:20)**2))},0);
  let fp=&#x27;&#x27;,tp=&#x27;&#x27;,v=0;
  for(let i=0;i&lt;=mins*60;i+=1){const t=i/60;v=v*0.6+(r()-0.5)*2.2;const b=145+v-decel(t);fp+=(i?&#x27;L&#x27;:&#x27;M&#x27;)+x(t).toFixed(1)+&#x27;,&#x27;+yF(b).toFixed(1);tp+=(i?&#x27;L&#x27;:&#x27;M&#x27;)+x(t).toFixed(1)+&#x27;,&#x27;+yT(cont(t)+(r()-0.5)*1.5).toFixed(1)}
  g+=`&lt;path d=&quot;${fp}&quot; fill=&quot;none&quot; style=&quot;stroke:var(--mon-fhr)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;path d=&quot;${tp}&quot; fill=&quot;none&quot; style=&quot;stroke:var(--mon-ua)&quot; stroke-width=&quot;1.4&quot;/&gt;`;
  return `&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; style=&quot;display:block;min-width:640px;width:100%;height:auto&quot; role=&quot;img&quot; aria-label=&quot;Fetal heart rate tracing over ten minutes with uterine contractions below&quot;&gt;${g}&lt;/svg&gt;`;
}
function ekgSvg(){
  const mm=5,secs=6,W=secs*25*mm,H=30*mm,base=H*0.6;
  let g=&#x27;&#x27;;
  for(let i=0;i&lt;=W/mm;i++){g+=`&lt;line x1=&quot;${i*mm}&quot; y1=&quot;0&quot; x2=&quot;${i*mm}&quot; y2=&quot;${H}&quot; stroke=&quot;#f1b7ae&quot; stroke-width=&quot;${i%5?0.4:1}&quot;/&gt;`}
  for(let j=0;j&lt;=H/mm;j++){g+=`&lt;line x1=&quot;0&quot; y1=&quot;${j*mm}&quot; x2=&quot;${W}&quot; y2=&quot;${j*mm}&quot; stroke=&quot;#f1b7ae&quot; stroke-width=&quot;${j%5?0.4:1}&quot;/&gt;`}
  const mv=10*mm, X=t=&gt;t*25*mm;
  const saw=t=&gt;{const p=0.2,ph=((t%p)+p)%p/p;return ph&lt;0.75?-0.17*ph/0.75:-0.17+0.17*(ph-0.75)/0.25};
  const gauss=(t,c,w,a)=&gt;a*Math.exp(-(((t-c)**2))/(2*w*w));
  let d=&#x27;&#x27;;
  for(let i=0;i&lt;=secs*500;i++){const t=i/500;let v=saw(t)+0.085;const k=Math.floor((t-0.06)/0.4),c=0.06+k*0.4+0.2;
    v+=gauss(t,c-0.018,0.008,-0.12)+gauss(t,c,0.01,1.25)+gauss(t,c+0.02,0.009,-0.25)+gauss(t,c+0.2,0.035,0.18);
    d+=(i?&#x27;L&#x27;:&#x27;M&#x27;)+X(t).toFixed(1)+&#x27;,&#x27;+(base-v*mv).toFixed(1)}
  g+=`&lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;#1d1d1d&quot; stroke-width=&quot;1.3&quot;/&gt;`;
  return `&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; style=&quot;display:block;min-width:620px;width:100%;height:auto&quot; role=&quot;img&quot; aria-label=&quot;Lead II rhythm strip, regular narrow complexes at about 150 per minute&quot;&gt;${g}&lt;/svg&gt;`;
}

function verdict(it,a){
  const first=a.pick===it.correct, fin=a.final===it.correct;
  if(it.arm===&quot;none&quot;)return first?[&quot;good&quot;,&quot;Right, with no AI read. This image was a control today.&quot;]:[&quot;bad&quot;,&quot;Missed, with no AI read. This one comes back on a later day.&quot;];

    if(first&amp;&amp;!fin)return[&quot;bad&quot;,&quot;The AI talked you out of a right answer. This is the harm the study counts.&quot;];

    if(!first&amp;&amp;a.final===it.aiPick)return[&quot;bad&quot;,&quot;You and the AI made the same miss.&quot;];
    return[&quot;bad&quot;,&quot;Missed, and the AI read was wrong too.&quot;];

  if(!first&amp;&amp;fin)return[&quot;good&quot;,&quot;The AI fixed your miss.&quot;];
  if(!first&amp;&amp;!fin)return[&quot;warn&quot;,&quot;You kept your answer over a correct AI read.&quot;];
  if(first&amp;&amp;fin)return[&quot;good&quot;,&quot;You and the AI agreed, and you were both right.&quot;];

}
