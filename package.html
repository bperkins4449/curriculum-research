&lt;div class=&quot;doc&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Proposal · draft for discussion&lt;/div&gt;
&lt;h1&gt;Catching AI Errors in Family Medicine&lt;/h1&gt;
&lt;p style=&quot;font-size:17px;color:var(--mut);margin:0&quot;&gt;A study and a short curriculum on how well our residents, and then our faculty, catch the mistakes AI makes.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;Brad Perkins, DO, MBA · for Dr. Lane Wilson, UMKC Family Medicine · November 2026&lt;/div&gt;

&lt;h2 style=&quot;border-top:0;padding-top:0;margin-top:10px&quot;&gt;In one page&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;The problem.&lt;/b&gt; AI now suggests diagnoses, drafts notes and patient messages, reads images and fills in risk calculators. When it is wrong, the output still looks right. In the studies I reviewed, wrong AI output pulled clinicians toward the wrong answer, and less experienced readers were pulled the most (Dratsch 2023; Jabbour 2023).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;What is missing.&lt;/b&gt; Of 52 studies I reviewed, only one looked at family medicine trainees, none tested a wrong risk-calculator result, and none was a controlled trial of teaching this skill measured by how many errors residents actually catch.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;What I propose.&lt;/b&gt; Each resident reviews 24 made-up cases of AI output, with an error planted in about two of every three. One didactic session gives us a baseline catch rate by type of AI, a resident versus faculty comparison, and the pre-test for a short teaching block we design together. A daily image game (fetal strip, EKG, skin photo) keeps the skill in practice.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Where it stands.&lt;/b&gt; I have already built the platform this runs on, including the daily image game. What is left is the case bank, the review screen and the data export. A design-and-pilot abstract can go to STFM by January 4, 2027, with the first resident session in January or February.&lt;/p&gt;
&lt;div class=&quot;box ask&quot;&gt;&lt;b&gt;What I am asking of you.&lt;/b&gt; To pick, with me, which version of this we run first. The gap analysis and six study options are below, each with the evidence behind it, and the open choices are listed at the end. Nothing is fixed yet.&lt;/div&gt;

&lt;h2&gt;What we already know&lt;/h2&gt;
&lt;div class=&quot;nums&quot;&gt;
&lt;div class=&quot;num&quot;&gt;&lt;b&gt;52&lt;/b&gt;&lt;span&gt;studies reviewed on clinicians and AI errors, 2012 to 2026&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;num&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;span&gt;in family medicine trainees (Zhou 2025, China), near chance&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;num&quot;&gt;&lt;b&gt;0&lt;/b&gt;&lt;span&gt;test catching a wrong risk-calculator result&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;num&quot;&gt;&lt;b&gt;0&lt;/b&gt;&lt;span&gt;controlled trials teaching the skill, scored by catch rate&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Most of the literature asks whether AI misleads clinicians. Very little asks whether we can teach clinicians to catch it. Two findings frame the project:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;When a model was deliberately biased, clinician accuracy fell 11.3 points, and adding explanations did not fix it (Jabbour 2023).&lt;/li&gt;
&lt;li&gt;With wrong AI reads, correct calls fell to 19.8% in inexperienced radiologists and 45.5% in very experienced ones (Dratsch 2023). Experience helps, but it does not protect.&lt;/li&gt;
&lt;/ul&gt;

&lt;h2&gt;Gap analysis&lt;/h2&gt;
&lt;p&gt;Seven gaps stand out. The proposed studies are built to fill the first five.&lt;/p&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th style=&quot;width:38%&quot;&gt;Gap&lt;/th&gt;&lt;th&gt;What the literature shows&lt;/th&gt;&lt;th style=&quot;width:16%&quot;&gt;Our study&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;No planted errors in AI notes or messages&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Of 20 documentation studies, 7 measured only the AI&#x27;s own error rate. None put physicians in front of drafts with known errors. Closest: IM residents under time pressure left more invented details in AI hospital courses (Small 2025).&lt;/td&gt;&lt;td&gt;Study 4&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;No wrong calculator results&lt;/b&gt;&lt;/td&gt;&lt;td&gt;No study tests whether clinicians catch a stale input or a score applied to the wrong patient.&lt;/td&gt;&lt;td&gt;Study 1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;One family medicine trainee study, outside the US&lt;/b&gt;&lt;/td&gt;&lt;td&gt;137 GP trainees in China judged ChatGPT-4o answers at 55% accuracy, close to chance (Zhou 2025).&lt;/td&gt;&lt;td&gt;Study 1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;No controlled teaching trial&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Twenty hours of AI-literacy training still left accuracy lower with wrong output, 73.3% vs 84.9% (Qazi 2026), and there was no untrained group. No curriculum uses catch rate on unseen cases as its outcome.&lt;/td&gt;&lt;td&gt;Study 3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;No reader sees several kinds of AI&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Every error-detection study uses one kind of AI, so we don&#x27;t know whether catching image errors carries over to notes.&lt;/td&gt;&lt;td&gt;Study 1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Trainee vs attending shown mostly for images&lt;/b&gt;&lt;/td&gt;&lt;td&gt;13 of 15 experience comparisons were image tasks. No one has compared them on AI differentials or drafts in primary care.&lt;/td&gt;&lt;td&gt;Study 2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Almost everything is simulated&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The four real-practice studies have no answer key, so they cannot say what was missed. None reaches patient outcomes.&lt;/td&gt;&lt;td&gt;Later&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;h2&gt;The first study&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Question.&lt;/b&gt; When a family medicine resident reviews AI output that is sometimes wrong, how often do they catch the error in four kinds of AI: a diagnosis suggestion, a drafted note or message, an image read, and a risk-calculator result? And how often do they flag correct output as wrong?&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;How a case works&lt;/h3&gt;
&lt;ol&gt;
&lt;li&gt;The resident gives their own answer and how sure they are.&lt;/li&gt;
&lt;li&gt;They see the AI output.&lt;/li&gt;
&lt;li&gt;They accept it, edit it, or flag the error and say where it is.&lt;/li&gt;
&lt;li&gt;They see the answer key.&lt;/li&gt;
&lt;/ol&gt;
&lt;p class=&quot;small&quot;&gt;Residents are told up front that some outputs are wrong, so there is no deception.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Design&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;24 cases per reader, 6 per type of AI, random order.&lt;/li&gt;
&lt;li&gt;In each type, 4 cases carry one planted error and 2 are correct, so false alarms can be counted.&lt;/li&gt;
&lt;li&gt;Two matched forms. Each resident takes one; the other becomes the post-test after teaching.&lt;/li&gt;
&lt;li&gt;All cases are made up and every AI output is fixed in advance. No patient data, no live model.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;What we measure&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Catch rate by type of AI:&lt;/b&gt; planted errors found and corrected, out of errors shown. This is the main outcome.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;False alarms:&lt;/b&gt; correct output flagged or changed, so &quot;flag everything&quot; doesn&#x27;t count as skill.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Net effect of AI:&lt;/b&gt; right answers changed to wrong, and wrong answers fixed.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Calibration:&lt;/b&gt; whether residents&#x27; confidence matches how often they are right.&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Size&lt;/h3&gt;
&lt;p&gt;About 36 residents, planning on 24 to 30 finishing, in one 45 to 50 minute didactic slot. With 30 residents, each type of AI gets about 120 planted-error reads, enough to estimate its catch rate within roughly 10 percentage points and to detect a 20-point difference between types. Faculty (about 12 to 20) take the same form. These numbers are planning assumptions; the first session replaces them with real ones.&lt;/p&gt;

&lt;h3&gt;Six studies from one case bank&lt;/h3&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th style=&quot;width:30%&quot;&gt;Study&lt;/th&gt;&lt;th&gt;Why it is new&lt;/th&gt;&lt;th style=&quot;width:16%&quot;&gt;Notes&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Same resident, four kinds of AI: how often are errors caught?&lt;/td&gt;&lt;td&gt;Every planted-error study in the 52 tests one kind of AI. None puts four kinds in front of the same trainee and counts false alarms beside catches.&lt;/td&gt;&lt;td&gt;Recommended first.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Residents vs attendings on the same planted errors&lt;/td&gt;&lt;td&gt;With wrong AI, correct reads fell to 19.8% in inexperienced and 45.5% in very experienced radiologists (Dratsch 2023). None of the 52 compares FM residents with their own attendings.&lt;/td&gt;&lt;td&gt;Same form, faculty session&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Teach it, then test on cases never seen&lt;/td&gt;&lt;td&gt;Two reviews found no AI teaching study evaluated above Kirkpatrick level 2 (Feigerlova 2025; Lai 2026). The closest resident workshop measured only confidence (Stephenson 2026).&lt;/td&gt;&lt;td&gt;Uses the second form&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;AI-drafted notes and messages: which errors get signed or sent?&lt;/td&gt;&lt;td&gt;42% of GPT-4 ED summaries had hallucinations (Williams 2025). Time-limited residents edited LLM hospital courses less than physician-written ones (Small 2025).&lt;/td&gt;&lt;td&gt;Documentation focus&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Own answer first vs AI first: does committing protect against wrong AI?&lt;/td&gt;&lt;td&gt;Decide-first has been tried with no planted errors (Yang 2026), so whether committing protects against wrong advice is unknown.&lt;/td&gt;&lt;td&gt;Order of the steps&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Dermatology: wrong AI labels on skin photos&lt;/td&gt;&lt;td&gt;The experience gradient with wrong AI is shown for radiology readers, not for FM trainees reading skin photos. A daily format gives repeated measures.&lt;/td&gt;&lt;td&gt;Fastest to start&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;h2&gt;The daily image game&lt;/h2&gt;
&lt;p&gt;Residents get one fetal heart tracing, one EKG and one skin photo a day. Each image comes with no AI read, a correct AI read, or a wrong one, balanced across the block and hidden from residents. They commit an answer and how sure they are, see the AI read, keep or change their answer, then get the teaching point. Missed images come back later. This gives us four measures with no extra sessions: answers the AI talked them out of, answers it fixed, calibration by image type, and change over the block.&lt;/p&gt;
&lt;p&gt;The game is already built and running on our residency site. You can add and key images yourself, so the dermatology items can be yours from the start.&lt;/p&gt;

&lt;h2&gt;First 90 days&lt;/h2&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th style=&quot;width:24%&quot;&gt;When&lt;/th&gt;&lt;th&gt;What&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Week 1&lt;/td&gt;&lt;td&gt;Agree on the question, the types of error, and the case blueprint. Name someone outside the evaluation chain to hold the study-ID key.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Weeks 1 to 3&lt;/td&gt;&lt;td&gt;Write 48 cases (two forms) with fixed AI outputs; faculty review each key.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Week 2&lt;/td&gt;&lt;td&gt;Submit for exempt determination.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Weeks 2 to 5&lt;/td&gt;&lt;td&gt;Build the review screen and export on the existing platform.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Week 5&lt;/td&gt;&lt;td&gt;Pilot the items with chief residents (not study data).&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;By Jan 4, 2027&lt;/td&gt;&lt;td&gt;STFM resident poster abstract: design and pilot, with results only if the exemption and a session land before the holidays.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Jan to Feb 2027&lt;/td&gt;&lt;td&gt;Resident baseline session; faculty session.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Feb 2027&lt;/td&gt;&lt;td&gt;Analysis; set sample sizes for the teaching trial; start the teaching block.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;h2&gt;Ethics&lt;/h2&gt;
&lt;p&gt;This is most likely exempt research rather than QI, since the aim is knowledge others can use. Made-up cases inside a didactic fit the exemptions for normal educational practice and educational tests (45 CFR 46.104(d)(1) and (d)(2)). The IRB makes the final call.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Made-up cases only. No patient data and no live model.&lt;/li&gt;
&lt;li&gt;Residents are told some outputs are wrong.&lt;/li&gt;
&lt;li&gt;Participation is voluntary; opting out of data use doesn&#x27;t affect the didactic.&lt;/li&gt;
&lt;li&gt;Someone outside the evaluation chain holds the study-ID key. As program director you would see only group results.&lt;/li&gt;
&lt;li&gt;Results are never used in resident evaluations. Faculty results are reported only as a group.&lt;/li&gt;
&lt;/ul&gt;


&lt;h2&gt;To decide together&lt;/h2&gt;
&lt;table&gt;
&lt;tr&gt;&lt;th style=&quot;width:30%&quot;&gt;Question&lt;/th&gt;&lt;th&gt;Options&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;What leads the project&lt;/td&gt;&lt;td&gt;Dermatology first · several kinds of AI · derm now, the rest later&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Where the wrong answers come from&lt;/td&gt;&lt;td&gt;We plant them · real AI mistakes · a mix&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;How far the outcome reaches&lt;/td&gt;&lt;td&gt;Skill on test cases · add a real-practice check later&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Who takes part&lt;/td&gt;&lt;td&gt;Residents only · residents and faculty · add students on rotation&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;How the teaching fits&lt;/td&gt;&lt;td&gt;Test, teach, retest · two groups, staggered · teach it, no study&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;What residents are told&lt;/td&gt;&lt;td&gt;Some answers are wrong · only that AI can err&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;h2&gt;Key references&lt;/h2&gt;
&lt;ol class=&quot;refs&quot;&gt;
&lt;li&gt;Jabbour S, et al. Measuring the Impact of AI in the Diagnosis of Hospitalized Patients: A Randomized Clinical Vignette Survey Study. JAMA. 2023. PMID 38112814.&lt;/li&gt;
&lt;li&gt;Dratsch T, et al. Automation Bias in Mammography: The Impact of Artificial Intelligence BI-RADS Suggestions on Reader Performance. Radiology. 2023. PMID 37129490.&lt;/li&gt;
&lt;li&gt;Zhou J, et al. Integrating AI into clinical education: evaluating general practice trainees&#x27; proficiency in distinguishing AI-generated hallucinations and impacting factors. BMC Med Educ. 2025. PMID 40108629.&lt;/li&gt;
&lt;li&gt;Qazi IA, et al. Automation Bias in Large Language Model-Assisted Diagnostic Reasoning among Physicians Trained in AI Literacy: A Randomized Clinical Trial. NEJM AI. 2026. PMID 42932681.&lt;/li&gt;
&lt;li&gt;Small WR, et al. Evaluating Hospital Course Summarization by an Electronic Health Record-Based Large Language Model. JAMA Netw Open. 2025. PMID 40802185.&lt;/li&gt;
&lt;li&gt;Williams CYK, et al. Evaluating large language models for drafting emergency department encounter summaries. PLOS Digit Health. 2025. PMID 40526634.&lt;/li&gt;

&lt;div class=&quot;wrap&quot;&gt;
&lt;header class=&quot;titleblock&quot;&gt;
  &lt;p class=&quot;eyebrow&quot;&gt;Research and curriculum proposal · draft for discussion&lt;/p&gt;
  &lt;h1&gt;Catching AI Errors in Family Medicine&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;A reader study and a curriculum to measure, and then teach, how well residents and faculty catch the errors AI makes.&lt;/p&gt;
  &lt;ul class=&quot;byline&quot;&gt;
    &lt;li&gt;&lt;b&gt;Prepared by&lt;/b&gt;Brad Perkins&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Prepared for&lt;/b&gt;Dr. Lane Wilson, UMKC Family Medicine&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Date&lt;/b&gt;November 2026&lt;/li&gt;
  &lt;/ul&gt;
&lt;/header&gt;
&lt;nav aria-label=&quot;Contents&quot;&gt;&lt;ul class=&quot;toc&quot;&gt;
  &lt;li&gt;&lt;a href=&quot;#summary&quot;&gt;Summary&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#try&quot;&gt;Sample item&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#numbers&quot;&gt;Background&lt;/a&gt;&lt;/li&gt;
  &lt;li&gt;&lt;a href=&quot;#study&quot;&gt;Proposed study&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#timeline&quot;&gt;Timeline&lt;/a&gt;&lt;/li&gt;
  &lt;li&gt;&lt;a href=&quot;#angles&quot;&gt;Research program&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#ethics&quot;&gt;Ethics&lt;/a&gt;&lt;/li&gt;
  &lt;li&gt;&lt;a href=&quot;#appendix&quot;&gt;Appendices&lt;/a&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/nav&gt;

&lt;section id=&quot;summary&quot; aria-labelledby=&quot;sum-h&quot;&gt;
  &lt;div class=&quot;sechead&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Summary&lt;/p&gt;&lt;h2 id=&quot;sum-h&quot;&gt;The proposal in brief&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;summary&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;The problem&lt;/h3&gt;&lt;p&gt;AI now drafts notes, suggests differentials, reads images and computes risk, and its errors look like correct output. In the studies reviewed here, wrong AI output pulled clinicians toward the wrong answer, and less experienced readers were pulled hardest (Dratsch 2023; Jabbour 2023).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;What is missing&lt;/h3&gt;&lt;p&gt;Of 52 studies reviewed, one focused on family medicine trainees, none tested a wrong risk-calculator result, and none was a controlled trial of teaching the skill scored by how many errors residents catch.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;What we propose&lt;/h3&gt;&lt;p&gt;Every resident, and then faculty, reviews 24 synthetic cases of AI output across four kinds of AI, with an error planted in two of every three. One session gives a baseline catch rate by AI type, a resident-versus-faculty comparison, and the pre-test for a short teaching block that we design together.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Where it stands&lt;/h3&gt;&lt;p&gt;I have already built the platform the study runs on. What remains is the case bank, the review screen, the data export and a key-review page. A design-and-pilot abstract can go to STFM by January 4, 2027, with the first resident session in January to February 2027.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ask&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;What I am asking of you&lt;/p&gt;&lt;p&gt;To pick, with me, which version of this we run first. The gap analysis, six study options and the evidence behind each are below, and the open choices are listed at the end of the decision page. Nothing is fixed yet.&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;built&quot; aria-labelledby=&quot;bu-h&quot;&gt;
  &lt;div class=&quot;sechead&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Platform&lt;/p&gt;&lt;h2 id=&quot;bu-h&quot;&gt;Already built, and what is left to build&lt;/h2&gt;
  &lt;p class=&quot;muted&quot;&gt;The study runs on tools I have already built and that residents in the program already use. Every case is synthetic and every AI output is frozen in advance, so no patient data and no live model are involved.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Already built&lt;/h3&gt;&lt;ul class=&quot;check&quot;&gt;
      &lt;li&gt;A case screen where the resident commits an answer and a confidence before any AI output is shown&lt;/li&gt;
      &lt;li&gt;Confidence calibration scoring (Brier score and calibration error, with intervals sized for a small sample)&lt;/li&gt;
      &lt;li&gt;Five validated risk calculators (PREVENT, KFRE, FIB-4, MELD 3.0, Child-Pugh), each checked against its paper&#x27;s worked example, to produce correct and planted-wrong calculator results&lt;/li&gt;
      &lt;li&gt;A dermatology photo trainer with 91 openly licensed cases&lt;/li&gt;
      &lt;li&gt;Server-side grading that keeps answer keys out of the browser&lt;/li&gt;
      &lt;li&gt;A daily case format residents already use: 752 attempts from 46 people as of November 2026&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;To build for this study&lt;/h3&gt;&lt;ul class=&quot;check todo&quot;&gt;
      &lt;li&gt;The planted-error case bank: 48 synthetic cases across Forms A and B, each with a frozen AI output and a faculty-reviewed key&lt;/li&gt;
      &lt;li&gt;The review screen that shows the AI output with tap-to-flag sentences (the sample item above is a preview)&lt;/li&gt;
      &lt;li&gt;A one-row-per-read export under study IDs, and a Keep / Fix / Cut page for faculty key review&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;ethics&quot; aria-labelledby=&quot;et-h&quot;&gt;
  &lt;div class=&quot;sechead&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;Ethics and oversight&lt;/p&gt;&lt;h2 id=&quot;et-h&quot;&gt;Likely exempt, with safeguards for supervised participants&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Determination&lt;/h3&gt;&lt;p id=&quot;irb&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Safeguards&lt;/h3&gt;&lt;ul&gt;
      &lt;li&gt;Synthetic cases only; no patient data and no live model&lt;/li&gt;
      &lt;li&gt;Readers are told up front that some outputs contain errors, so there is no deception&lt;/li&gt;
      &lt;li&gt;Participation is voluntary, with an opt-out of data use that does not affect the didactic&lt;/li&gt;
      &lt;li&gt;A person outside the evaluation chain holds the study-ID key; the program director sees only aggregate results&lt;/li&gt;
      &lt;li&gt;Results are never used in resident evaluations; faculty results are reported only in aggregate&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
